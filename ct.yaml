# Configuration for helm/chart-testing, used by the install job in CI.
# Charts live under charts/, one directory per chart, which is where ct looks.
remote: origin
target-branch: main
check-version-increment: false
validate-maintainers: false
helm-extra-args: --timeout 900s
namespace: ""
release-label: app.kubernetes.io/instance
chart-dirs:
  - charts
