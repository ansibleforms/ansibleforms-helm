{{- if and (eq (include "ansibleforms.rte.enabled" .) "true") (not (dig "rte" "existingTokenSecret" "" (.Values.containers | default dict))) }}
{{- $given := toString (dig "rte" "token" "" (.Values.applications | default dict)) }}
{{- if and $given (lt (len $given) 16) }}
{{- fail (printf "\n\napplications.rte.token is %d characters. The RTE refuses to start with a token shorter than 16.\n\nGive it a longer one, or leave it empty and the chart generates one.\n" (len $given)) }}
{{- end }}
{{- /*
  The value already in the cluster, so a generated token survives every upgrade. Unlike
  ENCRYPTION_SECRET, generating one again where there is no cluster to read (helm template,
  Argo CD, Flux) breaks nothing: the app and the RTE share the pod, both read the Secret
  when the pod starts, and the config seed writes the token into the app's runner on every
  start, as ${RTE_TOKEN} (the chart's seed, or yours written the same way). Argo CD only
  reports the Secret as changed after each render; set applications.rte.token or
  containers.rte.existingTokenSecret to quiet it.
*/}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace (include "ansibleforms.rte.tokenSecretName" .)) }}
{{- $existingToken := dig "data" "RTE_TOKEN" "" ($existing | default dict) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ansibleforms.rte.tokenSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ansibleforms.server.labels" . | nindent 4 }}
  {{- with (include "ansibleforms.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{- if $given }}
  RTE_TOKEN: {{ $given | b64enc }}
  {{- else if $existingToken }}
  RTE_TOKEN: {{ $existingToken }}
  {{- else }}
  RTE_TOKEN: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
{{- end }}
