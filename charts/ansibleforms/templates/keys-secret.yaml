{{- /*
  The keys the chart generates for the app itself, kept apart from <release>-secrets so a
  Secret managed outside the chart (secrets.existingSecret) never needs a new key to
  upgrade. Each one is taken from values when given, else read back from the cluster, else
  generated once:

  ACCESS_TOKEN_SECRET signs the sessions. Without it the app makes one up at every start
  and signs everybody out on each restart.
  RTE_TOKEN is what the app sends the RTE with every call.

  Neither is a key to stored data, so generating one again where there is no cluster to
  read (helm template, Argo CD, Flux) breaks nothing: the app and the RTE share the pod,
  both read this Secret when the pod starts, and the config seed writes the token into the
  runner on every start, as ${RTE_TOKEN}. The worst it does is end the sessions on the next
  restart, which is what happened on every restart before. Argo CD only reports the Secret
  as changed after each render; set the values to keep it still.
*/}}
{{- $appEnv := ((.Values.applications | default dict).server | default dict).env | default dict }}
{{- $rteOn := eq (include "ansibleforms.rte.enabled" .) "true" }}
{{- $ownToken := and $rteOn (not (dig "rte" "existingTokenSecret" "" (.Values.containers | default dict))) }}
{{- $givenToken := toString (dig "rte" "token" "" (.Values.applications | default dict)) }}
{{- if and $ownToken $givenToken (lt (len $givenToken) 16) }}
{{- fail (printf "\n\napplications.rte.token is %d characters. The RTE refuses to start with a token shorter than 16.\n\nGive it a longer one, or leave it empty and the chart generates one.\n" (len $givenToken)) }}
{{- end }}
{{- $given := dict }}
{{- with (toString ($appEnv.ACCESS_TOKEN_SECRET | default "")) }}{{ $_ := set $given "ACCESS_TOKEN_SECRET" . }}{{ end }}
{{- if and $ownToken $givenToken }}{{ $_ := set $given "RTE_TOKEN" $givenToken }}{{ end }}
{{- $keys := list "ACCESS_TOKEN_SECRET" }}
{{- if $ownToken }}{{ $keys = append $keys "RTE_TOKEN" }}{{ end }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace (include "ansibleforms.keysSecretName" .)) }}
{{- $existingData := (($existing).data) | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ansibleforms.keysSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ansibleforms.server.labels" . | nindent 4 }}
  {{- with (include "ansibleforms.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{- range $key := $keys }}
  {{- if hasKey $given $key }}
  {{ $key }}: {{ index $given $key | b64enc }}
  {{- else if hasKey $existingData $key }}
  {{ $key }}: {{ index $existingData $key }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum (ternary 64 32 (eq $key "ACCESS_TOKEN_SECRET")) | b64enc }}
  {{- end }}
  {{- end }}
