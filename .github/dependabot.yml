version: 2

# Keeps the workflow actions on their latest version, majors included : CI lints the chart,
# installs it on three Kubernetes versions and upgrades a live release on every pull request,
# so a breaking action fails there before it merges. Updates are never grouped : every
# action gets its own pull request, so each one can be reviewed and reverted on its own.
#
# The images in values.yaml are not watched. CI refuses a change to values.yaml that does
# not move the chart version, which Dependabot cannot do, so every image pull request would
# fail by design. Image bumps go out with a chart release instead.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # The maintenance line runs the same workflows, so its actions are kept current too.
  - package-ecosystem: github-actions
    directory: /
    target-branch: release/6.x
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
